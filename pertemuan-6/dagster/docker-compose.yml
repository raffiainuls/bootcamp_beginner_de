services:
  dagster-webserver:
    build:
      context: ../..
      dockerfile: pertemuan-6/dagster/Dockerfile
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /workspace/pertemuan-6/dagster/workspace.yaml
    ports:
      - "3000:3000"
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PGHOST: host.docker.internal
      PGPORT: "5433"
      PGDATABASE: nusacode_db
      PGUSER: postgresdev
      PGPASSWORD: adminpass123
      CH_HOST: host.docker.internal
      CH_PORT: "8123"
      CH_USER: clickhousedev
      CH_PASSWORD: adminpass123
    volumes:
      - dagster_home:/opt/dagster/dagster_home
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dagster-daemon:
    build:
      context: ../..
      dockerfile: pertemuan-6/dagster/Dockerfile
    command: dagster-daemon run -w /workspace/pertemuan-6/dagster/workspace.yaml
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PGHOST: host.docker.internal
      PGPORT: "5433"
      PGDATABASE: nusacode_db
      PGUSER: postgresdev
      PGPASSWORD: adminpass123
      CH_HOST: host.docker.internal
      CH_PORT: "8123"
      CH_USER: clickhousedev
      CH_PASSWORD: adminpass123
    volumes:
      - dagster_home:/opt/dagster/dagster_home
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - dagster-webserver

volumes:
  dagster_home:

