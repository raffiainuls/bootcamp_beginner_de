services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgresdev
      POSTGRES_PASSWORD: adminpass123
      POSTGRES_DB: nusacode_db
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresdev -d nusacode_db"]
      interval: 3s
      timeout: 3s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: clickhousedev
      CLICKHOUSE_PASSWORD: adminpass123
    ports: ["8123:8123", "9000:9000"]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 20
