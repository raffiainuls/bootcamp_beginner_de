dbt_clickhouse_project:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: default
      host: "{{ env_var('CH_HOST', 'localhost') }}"
      port: "{{ env_var('CH_PORT', '8123') | int }}"
      user: "{{ env_var('CH_USER', 'clickhousedev') }}"
      password: "{{ env_var('CH_PASSWORD', 'adminpass123') }}"
      secure: false
      threads: 2

